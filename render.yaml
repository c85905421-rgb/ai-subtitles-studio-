services:
  - type: web
    name: ai-subtitle-studio
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    disk:
      name: subtitle-uploads
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MAX_UPLOAD_GB
        value: "2"
      - key: UPLOAD_DIR
        value: /var/data
